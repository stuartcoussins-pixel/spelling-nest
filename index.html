<!doctype html>
<html lang="en-GB">
<meta name="description" content="Weekly spelling practice for primary school children.">
<title>Spelling Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#022140; --pink:#F7B1BF; --pink-deep:#E98FA4; --gold:#E39A2A; --gold-soft:#FCEFD9;
  --ground:#F1F5F8; --surface:#FFFFFF; --surface-2:#E4ECF3; --ink:#022140; --ink-soft:#4B6179; --line:#D3DEE8;
  --primary:#022140; --primary-ink:#FFFFFF; --primary-edge:#F7B1BF;
  --accent:#F7B1BF; --accent-soft:#FDE9EE; --accent-ink:#022140;
  --tile:#FFFFFF; --tile-ink:#022140; --tile-edge:#F7B1BF; --slot:#E4ECF3;
  --good:#1D855A; --good-soft:#DCF2E6; --bad:#BF3A36; --bad-soft:#FBE3E0;
  --owl-body:#022140; --owl-wing:#0B3563;
  --shadow:0 10px 30px rgba(2,33,64,.10);
  --tile-size:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061527; --surface:#0C2139; --surface-2:#132E4B; --ink:#EAF1F8; --ink-soft:#9FB3C8; --line:#1F3B5A;
    --primary:#F7B1BF; --primary-ink:#022140; --primary-edge:#B9687C;
    --accent-soft:#2A2235; --tile:#15314F; --tile-ink:#FFFFFF; --tile-edge:#F7B1BF; --slot:#0F2842;
    --good:#63D59E; --good-soft:#103628; --bad:#FF8F85; --bad-soft:#3A1B22; --gold:#F2B650; --gold-soft:#35290F;
    --owl-body:#1D4A78; --owl-wing:#2A5E93; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#061527; --surface:#0C2139; --surface-2:#132E4B; --ink:#EAF1F8; --ink-soft:#9FB3C8; --line:#1F3B5A;
  --primary:#F7B1BF; --primary-ink:#022140; --primary-edge:#B9687C;
  --accent-soft:#2A2235; --tile:#15314F; --tile-ink:#FFFFFF; --tile-edge:#F7B1BF; --slot:#0F2842;
  --good:#63D59E; --good-soft:#103628; --bad:#FF8F85; --bad-soft:#3A1B22; --gold:#F2B650; --gold-soft:#35290F;
  --owl-body:#1D4A78; --owl-wing:#2A5E93; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:Outfit,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 110px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .owl{width:40px;height:40px;flex:none}
.brand-name{font-weight:800;font-size:1.1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--pink-deep)}
.pills{display:flex;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1.5px var(--line)}
.pill svg{width:18px;height:18px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ground) 70%,transparent);z-index:5}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.tab{background:none;border:0;border-radius:16px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--pink-deep)}

/* shared */
.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{border:0;border-radius:18px;padding:15px 20px;font-weight:700;font-size:1.08rem;background:var(--primary);color:var(--primary-ink);box-shadow:0 5px 0 var(--primary-edge);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--primary-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.pink{background:var(--pink);color:var(--navy);box-shadow:0 5px 0 var(--pink-deep)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.ghost{border:0;background:var(--surface-2);border-radius:14px;padding:11px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.ghost svg{width:20px;height:20px}
.ghost.small{padding:7px 12px;font-size:.9rem}
.ghost:disabled{opacity:.45}
.danger{color:var(--bad)}
.muted{color:var(--ink-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* owl */
.owl .wing-l,.owl .wing-r{transform-box:fill-box}
.owl .wing-l{transform-origin:100% 20%}.owl .wing-r{transform-origin:0% 20%}
.owl.cheer{animation:hop .6s ease 2}
.owl.cheer .wing-l{animation:flapL .3s ease 4}.owl.cheer .wing-r{animation:flapR .3s ease 4}
.owl .pupils{transition:transform .3s}
.owl.think .pupils{transform:translate(3px,-4px)}
.owl .lids{opacity:0;transition:opacity .2s}
.owl.sleepy .lids{opacity:1}
@keyframes hop{50%{transform:translateY(-8px)}}
@keyframes flapL{50%{transform:rotate(28deg)}}
@keyframes flapR{50%{transform:rotate(-28deg)}}

.hello{display:flex;align-items:flex-end;gap:12px}
.hello .owl{width:92px;height:92px;flex:none}
.bubble{position:relative;background:var(--surface);border-radius:20px 20px 20px 6px;padding:14px 16px;box-shadow:var(--shadow);font-size:1.12rem;font-weight:500}
.bubble b{font-weight:800}

.words{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:Andika,Outfit,sans-serif;font-size:1.15rem;background:var(--ground);border-radius:12px;padding:5px 11px 4px;display:inline-flex;align-items:center;gap:7px}
.pips{display:inline-flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--good)}
.chip.mastered{background:var(--good-soft)}

/* progress */
.streak{display:flex;align-items:center;gap:14px}
.flame{width:64px;height:72px;flex:none;position:relative;display:grid;place-items:center}
.flame svg{position:absolute;inset:0;width:100%;height:100%}
.flame b{position:relative;top:10px;font-size:1.3rem;font-weight:800;color:var(--navy)}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week span{font-size:.75rem;color:var(--ink-soft);font-weight:600}
.dot{width:100%;max-width:34px;aspect-ratio:1;margin:4px auto 0;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.dot.on{background:var(--good);color:#fff}
.dot.today{box-shadow:0 0 0 2.5px var(--pink)}
.dot svg{width:60%;height:60%}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(2,33,64,.08)}
.wordrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:10px}
.wordrow:last-child{border-bottom:0}
.wordrow .w{font-family:Andika,Outfit,sans-serif;font-size:1.25rem}
.wordrow small{color:var(--ink-soft);font-size:.85rem}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{background:var(--surface);border-radius:20px;padding:16px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.medal{width:72px;height:72px}
.badge h3{font-size:1rem}
.badge p{margin:0;font-size:.82rem;color:var(--ink-soft)}
.badge.locked .medal{filter:grayscale(1);opacity:.35}
.badge.locked h3{color:var(--ink-soft)}

/* grown ups */
.gate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:30px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:var(--pink);transform:scaleX(0);transform-origin:left;opacity:.5}
.hold.holding .fill{transition:transform 1.5s linear;transform:scaleX(1)}
.hold span{position:relative}
label.lbl{font-weight:700;font-size:.92rem;display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=date],textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px}
textarea{min-height:96px;resize:vertical}
.draft .chip button{border:0;background:none;padding:0 0 0 2px;font-size:1rem;color:var(--ink-soft);line-height:1}
.listrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listrow:last-child{border-bottom:0}
.listrow .t{flex:1;min-width:150px}
.listrow .t b{display:block}
.inuse{font-size:.78rem;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:3px 10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle{width:52px;height:30px;border-radius:999px;border:0;background:var(--surface-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--good)}
.toggle[aria-checked="true"]::after{left:25px}
.note{font-size:.88rem;color:var(--ink-soft);margin:0}
.filebtn{position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* lesson */
.lesson{position:relative;background:var(--ground);min-height:100%}
.lesson-inner{max-width:600px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 0}
.lhead{display:flex;align-items:center;gap:12px}
.xbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.xbtn svg{width:20px;height:20px}
.bar{flex:1;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:999px;transition:width .35s ease}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.prompt{display:flex;align-items:center;gap:10px;margin-block:16px 8px}
.prompt .owl{width:58px;height:58px;flex:none}
.prompt h2{font-size:1.35rem;font-weight:800}
.prompt p{margin:2px 0 0;color:var(--ink-soft)}
.lbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:10px}
.slots,.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.slots{--n:6;min-height:calc(var(--tile-size) * 1.15)}
.pool{padding-top:6px}
.slot,.tile{width:var(--tile-size);height:calc(var(--tile-size) * 1.15);border-radius:14px;display:grid;place-items:center;font-family:Andika,Outfit,sans-serif;font-weight:700;font-size:calc(var(--tile-size) * .58);line-height:1;border:0;padding:0}
.slot{background:var(--slot);box-shadow:inset 0 3px 0 rgba(2,33,64,.07)}
.slot.filled{background:var(--tile);color:var(--tile-ink);box-shadow:0 0 0 2px var(--pink)}
.slot.fixed{background:transparent;color:var(--ink);box-shadow:inset 0 -3px 0 var(--line)}
.slot.right{background:var(--good-soft);box-shadow:0 0 0 2px var(--good);color:var(--good)}
.slot.wrong{background:var(--bad-soft);box-shadow:0 0 0 2px var(--bad);color:var(--bad)}
.tile{background:var(--tile);color:var(--tile-ink);box-shadow:0 5px 0 var(--tile-edge), 0 0 0 1.5px var(--line);transition:transform .07s, box-shadow .07s}
.tile:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--tile-edge), 0 0 0 1.5px var(--line)}
.tile:disabled{background:var(--slot);box-shadow:none;color:transparent;cursor:default}
.free-placeholder{color:var(--ink-soft);align-self:center;font-size:1rem;border:2px dashed var(--line);border-radius:14px;padding:14px 18px}
.free-tools{display:flex;justify-content:center}
.bigword{font-family:Andika,Outfit,sans-serif;font-size:clamp(2.6rem,12vw,4.2rem);font-weight:700;text-align:center;letter-spacing:.02em;line-height:1.2}
.word .chunk{border-radius:10px;padding:0 1px;transition:background .15s,color .15s}
.word .chunk+.chunk{margin-left:2px}
.word .chunk.lit{background:var(--pink);color:var(--navy)}
.word.sm{font-family:Andika,Outfit,sans-serif;font-size:1.9rem;font-weight:700}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.steps span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft)}
.steps span.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .steps span.on{background:var(--pink);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps span.on{background:var(--pink);color:var(--navy)}}
.lookcard{background:var(--surface);border-radius:24px;padding:22px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.covered{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.covered i{width:calc(var(--tile-size) * .7);height:calc(var(--tile-size) * .9);border-radius:10px;background:repeating-linear-gradient(45deg,var(--navy) 0 8px,#0b3563 8px 16px)}
.coach{display:flex;gap:10px;align-items:flex-start}
#coach{min-height:104px;display:flex;flex-direction:column;justify-content:flex-end}
.coach .bubble{font-size:1rem;flex:1}
.coach .owl{width:44px;height:44px;flex:none}
.dots{display:inline-flex;gap:6px;vertical-align:middle;margin-left:4px}
.dots .chunk{width:14px;height:14px;border-radius:50%;background:var(--surface-2);display:inline-block}
.dots .chunk.lit{background:var(--pink)}
.laction{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:12px;padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ground)}
.fb{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:up .22s ease}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}.fb.plain{background:var(--surface);box-shadow:var(--shadow)}
.fb h3{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:8px}
.fb.good h3{color:var(--good)}.fb.bad h3{color:var(--bad)}.fb h3 svg{width:28px;height:28px}
.listen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.listen .ghost{justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:12px}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
.sheet.good{background:var(--good-soft)}
.sheet.bad{background:var(--bad-soft)}
.sheet.plain{background:var(--surface);box-shadow:0 -10px 30px rgba(2,33,64,.12)}
.sheet h3{font-size:1.35rem;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet.good h3{color:var(--good)}
.sheet.bad h3{color:var(--bad)}
.sheet h3 svg{width:28px;height:28px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.endcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.endcard .owl{width:130px;height:130px}
.endcard h2{font-size:1.9rem;font-weight:800}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.newbadges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.newbadges .medal{width:60px;height:60px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:11px 16px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (max-width:440px){ .brand-name{display:none} .hello .owl{width:72px;height:72px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
[hidden]{display:none!important}
/* v5: sign in */
.consent{display:flex;gap:12px;align-items:flex-start;font-weight:600;line-height:1.4}
.consent input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:#022140}
a{color:inherit}
.linkbtn{text-decoration:none}
/* v4: scorecard */
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{fill:var(--surface-2)}
.stars svg.on{fill:#F2B650;filter:drop-shadow(0 2px 0 #C9831B)}
.bigscore{display:flex;align-items:baseline;gap:8px;justify-content:center}
.bigscore b{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bigscore span{font-size:1.2rem;font-weight:700;color:var(--ink-soft)}
.scorerow{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.scorerow:last-child{border-bottom:0}
.scorerow .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.scorerow .mark svg{width:18px;height:18px}
.scorerow.first .mark{background:var(--good)}.scorerow.hint .mark{background:var(--gold)}.scorerow.missed .mark{background:var(--bad)}
.scorerow .w{font-family:Andika,Outfit,sans-serif;font-size:1.3rem;font-weight:700}
.scorerow .lab{font-size:.85rem;font-weight:600;color:var(--ink-soft)}
@media (max-width:380px){.scorerow .lab{display:none}}
.histrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.histrow:last-child{border-bottom:0}
.histrow .t{flex:1;min-width:0}
.histrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histrow .sc{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* v2: profiles, onboarding, keypad */
.app.bare{padding-bottom:24px}
.profbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line);max-width:150px}
.profbtn span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:.95rem}
.avatar.lg{width:72px;height:72px;font-size:2rem}
.brand-name.solo{font-size:1.15rem}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.splash .owl{width:120px;height:120px}
.onboard{display:flex;flex-direction:column;gap:18px;padding-block:10px 20px;max-width:460px;margin:0 auto;width:100%}
.onboard .owl{width:110px;height:110px;align-self:center}
.onboard h1{font-size:clamp(1.7rem,6vw,2.2rem);font-weight:800;text-align:center;letter-spacing:-.01em}
.onboard .lead{text-align:center;color:var(--ink-soft);margin:0;font-size:1.05rem}
.obsteps{display:flex;justify-content:center;gap:6px}
.obsteps i{width:28px;height:6px;border-radius:999px;background:var(--surface-2)}
.obsteps i.on{background:var(--pink)}
.bigin{font-size:1.4rem!important;text-align:center;padding:14px!important;border-radius:18px!important}
.yeargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.yeargrid button{border:0;background:var(--surface);border-radius:16px;padding:14px 10px;font-weight:700;font-size:1.05rem;box-shadow:inset 0 0 0 2px var(--line)}
.yeargrid button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--pink);background:var(--accent-soft)}
.yeargrid button.wide{grid-column:1/-1}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.pindots{display:flex;gap:14px}
.pindots i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--ink-soft)}
.pindots i.on{background:var(--ink);box-shadow:none}
.pindots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keypad button{height:64px;border:0;border-radius:20px;background:var(--surface);font-size:1.6rem;font-weight:700;box-shadow:0 4px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.keypad button.fn{background:transparent;box-shadow:none;font-size:1rem;color:var(--ink-soft)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pickcard{border:0;background:var(--surface);border-radius:22px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);font-weight:700;font-size:1.1rem}
.pickcard small{font-weight:500;color:var(--ink-soft);font-size:.85rem}
.pickcard.add{background:transparent;box-shadow:inset 0 0 0 2px dashed var(--line);border:2px dashed var(--line)}
.pickcard.add .avatar{background:var(--surface-2);color:var(--ink)}
.err{color:var(--bad);font-weight:600;margin:0;text-align:center;min-height:1.4em}

/* ---------- state & persistence (Supabase) ---------- */

let sb=null, user=null, syncMsg='', loadingProfile=false, deletedLists=new Set(), authMsg='', authEmail='', consentTicked=false, confirmWipe=false;
const uuid=()=>{try{return crypto.randomUUID()}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}};
function syncErr(e,what){

}
async function run(q,what){const {data,error}=await q; if(error){syncErr(error,what);throw error} return data}
const pendingWrites={};
function later(key,fn){clearTimeout(pendingWrites[key]);pendingWrites[key]=setTimeout(()=>{fn().catch(()=>{})},350)}

function persistAccount(){
  if(!user) return;
  later('account',async()=>{
    await run(sb.from('families').update({pin_hash:S.account.pin,sound:!!S.account.sound}).eq('parent_id',user.id),'settings');
    const rows=S.account.profiles.map(p=>({id:p.id,parent_id:user.id,name:p.name,school_year:p.year||'none'}));
    if(rows.length) await run(sb.from('spellers').upsert(rows),'profiles');
  });
}
function persistLists(){
  const pid=S.pid; if(!user||!pid) return; const snapshot=JSON.parse(JSON.stringify(S.lists)); const gone=[...deletedLists]; deletedLists.clear();
  later('lists_'+pid,async()=>{
    for(const id of gone) await run(sb.from('word_lists').delete().eq('id',id),'word lists');
    const rows=Object.entries(snapshot.lists||{}).map(([id,l])=>({id,parent_id:user.id,speller_id:pid,title:(l.title||'Spellings').slice(0,80),words:l.words||[],is_active:id===snapshot.activeListId,test_date:l.testDate||null,created_at:new Date(l.createdAt||Date.now()).toISOString()}));
    if(rows.length) await run(sb.from('word_lists').upsert(rows),'word lists');
  });
}
function progressRow(pid){const P=S.progress;return {speller_id:pid,parent_id:user.id,xp:P.xp||0,lessons:P.lessons||0,clean_hear:P.cleanHear||0,days:P.days||[],badges:P.badges||{},words:P.words||{},updated_at:new Date().toISOString()}}

function saveHistory(entry){

}

function getClient(){
  if(window.__SN_SUPABASE__) return window.__SN_SUPABASE__;
  if(!window.supabase||!window.supabase.createClient) return null;
  return window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}
async function connect(){
  sb=getClient();
  if(!sb){view='offline';renderChrome();renderView();return}
  sb.auth.onAuthStateChange((event,session)=>{
    if(session&&session.user&&(!user||user.id!==session.user.id)){setTimeout(()=>boot(session),0)}
    if(event==='SIGNED_OUT'){user=null;resetState();view='signin';renderChrome();renderView()}
  });
  const {data}=await sb.auth.getSession();
  if(data&&data.session) boot(data.session);
  else if(!user){view='signin';renderChrome();renderView()}
}
function resetState(){S.account=defAccount();S.pid=null;S.lists=blankLists();S.progress=blankProgress();unlocked=false}
async function boot(session){
  if(user&&user.id===session.user.id) return;
  user=session.user; view='splash'; renderChrome(); renderView();
  try{
    if(location.hash&&/access_token|error/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search);
    const fam=await run(sb.from('families').select('*').eq('parent_id',user.id).maybeSingle(),'account');
    if(!fam||!fam.consented_at){view='consent';renderChrome();renderView();return}
    await loadFamily(fam);
  }catch(e){view='loaderror';renderChrome();renderView()}
}
async function loadFamily(fam){
  const sp=await run(sb.from('spellers').select('*').eq('parent_id',user.id).order('created_at',{ascending:true}),'profiles');
  S.account={pin:fam.pin_hash||null,sound:fam.sound!==false,profiles:(sp||[]).map(s=>({id:s.id,name:s.name,year:s.school_year||'none',createdAt:Date.parse(s.created_at)||Date.now()}))};
  afterAccount();
}
async function giveConsent(){
  try{
    await run(sb.from('families').upsert({parent_id:user.id,consented_at:new Date().toISOString(),sound:true}),'consent');

    await loadFamily(fam);
  }catch(e){renderView()}
}
function afterAccount(){
  const profs=S.account.profiles;

  if(!S.pid){ if(profs.length===1) selectProfile(profs[0].id); else {view='pick';renderChrome();renderView()} return }

async function selectProfile(pid,keep){
  S.pid=pid; unlocked=false; draft={id:null,title:'',words:[],testDate:''}; confirmDel=null; confirmReset=false; confirmProfDel=false;
  if(!keep){
    S.lists=blankLists(); S.progress=blankProgress();

      const [lists,prog,hist]=await Promise.all([
        run(sb.from('word_lists').select('*').eq('speller_id',pid).order('created_at',{ascending:true}),'word lists'),
        run(sb.from('speller_progress').select('*').eq('speller_id',pid).maybeSingle(),'progress'),

      ]);
      if(S.pid!==pid) return;
      const L={lists:{},activeListId:null};
      (lists||[]).forEach(r=>{L.lists[r.id]={title:r.title,words:r.words||[],createdAt:Date.parse(r.created_at)||Date.now(),testDate:r.test_date||''};if(r.is_active)L.activeListId=r.id});
      S.lists=L;
      S.progress=Object.assign(blankProgress(),prog?{xp:prog.xp||0,lessons:prog.lessons||0,cleanHear:prog.clean_hear||0,days:(prog.days||[]).map(String),badges:plain(prog.badges)||{},words:plain(prog.words)||{}}:{});
      S.progress.history=(hist||[]).slice().reverse().map(h=>({at:Date.parse(h.created_at)||Date.now(),list:h.list_title||'',practice:!!h.practice,reason:h.reason,score:h.score,total:h.total,stars:h.stars,xp:h.xp,secs:h.seconds,missed:h.missed||[]}));
    }catch(e){view='loaderror';renderChrome();renderView();return}
  }
  view='play'; renderChrome(); renderView(); window.scrollTo(0,0);

const plain=d=>{try{return d==null?d:JSON.parse(JSON.stringify(d))}catch(e){return {}}};

async function hashPin(pin){
  const txt='spelling-nest:'+pin;
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}
}
/* ---------- phonics chunks & speech ---------- */
const GRAPH=['tch','dge','igh','air','ear','ure','ore','eer','ch','sh','th','ph','wh','ck','ng','qu','ai','ay','ee','ea','oa','ow','ou','oi','oy','oo','ar','or','ur','er','ir','aw','au','ew','ue','ie','ss','ll','ff','zz'];
const ENDINGS=['ge','ce','le','ve','se','ze'];
function chunks(w){const out=[];let i=0;while(i<w.length){let m=null;for(const e of ENDINGS){if(i>0&&i+e.length===w.length&&w.startsWith(e,i)){m=e;break}}if(!m)for(const g of GRAPH){if(w.startsWith(g,i)){if(/^(ar|or|ur|er|ir|ow|ew|aw)$/.test(g)&&/[aeiour]/.test(w[i+2]||''))continue;m=g;break}}if(!m)m=w[i];out.push(m);i+=m.length}return out}
function tricky(w){const cs=chunks(w);let pos=0;for(let k=0;k<cs.length;k++){if(cs[k].length>1){const where=k===0?'at the start':k===cs.length-1?'at the end':'in the middle';return {c:cs[k],where}}pos+=cs[k].length}return null}

let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|libby|sonia|serena|kate|hazel|susan|martha/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayTimers=[];
function lightChunks(i){document.querySelectorAll('[data-say-target]').forEach(t=>[...t.children].forEach((c,j)=>c.classList.toggle('lit',j===i)))}
function say(word,{slow=false,onEnd}={}){
  sayTimers.forEach(clearTimeout);sayTimers=[];lightChunks(-1);
  if(!('speechSynthesis' in window)){onEnd&&onEnd();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  if(voice)u.voice=voice; u.lang=voice?voice.lang:'en-GB'; u.rate=slow?0.42:0.85; u.pitch=1.05;
  const cs=chunks(word);
  u.onstart=()=>{if(!slow)return;const total=Math.max(900,word.length*230);const step=total/cs.length;cs.forEach((c,i)=>sayTimers.push(setTimeout(()=>lightChunks(i),i*step)));sayTimers.push(setTimeout(()=>lightChunks(-1),total+250))};
  u.onend=()=>{onEnd&&onEnd()};
  setTimeout(()=>speechSynthesis.speak(u),60);
}
function sayAll(words){let i=0;const next=()=>{if(i>=words.length)return;const w=words[i++];say(w,{onEnd:()=>setTimeout(next,700)})};next()}

function tone(freqs,dur,type){if(!S.account.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;const s=t+i*dur;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.16,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+dur);o.connect(g).connect(actx.destination);o.start(s);o.stop(s+dur+0.05)})}catch(e){}}
const sfx={tap:()=>tone([700],0.05,'triangle'),good:()=>tone([523,659,784],0.1),bad:()=>tone([294,220],0.15,'triangle'),win:()=>tone([523,659,784,1047],0.13)};

function toJpeg(file){
  return new Promise(resolve=>{
    try{
      const url=URL.createObjectURL(file); const img=new Image();
      img.onload=()=>{try{const max=1600;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>resolve(b||file),'image/jpeg',0.85)}catch(e){resolve(file)}};
      img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};
      img.src=url;
    }catch(e){resolve(file)}
  });
}

function distractors(source,exclude,n){const ex=new Set(exclude);const cand=[];for(const ch of source)for(const c of (CONF[ch]||''))if(!ex.has(c)&&!cand.includes(c))cand.push(c);shuffle(cand);const abc='abcdefghijklmnopqrstuvwxyz';let guard=0;while(cand.length<n&&guard++<200){const c=abc[Math.floor(Math.random()*26)];if(!ex.has(c)&&!cand.includes(c))cand.push(c)}return cand.slice(0,n)}

const TYPES=[['unjumble',2],['missing',2],['lcwc',2],['hear',3]];
function pickType(prev){const last2=prev.slice(-2).map(q=>q.type);let t;let guard=0;do{const total=TYPES.reduce((s,x)=>s+x[1],0);let r=Math.random()*total;t=TYPES.find(x=>(r-=x[1])<0)[0]}while(guard++<10&&last2.length===2&&last2[0]===t&&last2[1]===t);return t}

  let slots=isFree?[]:Array.from({length},(_,i)=>fixed&&fixed[i]?{fixed:fixed[i]}:null);
  let locked=false,result=null;
  const setSize=()=>{const n=Math.max(isFree?Math.max(slots.length,pool.length>7?7:pool.length):slots.length,Math.min(pool.length,7));const w=Math.min(host.clientWidth||340,560);host.style.setProperty('--tile-size',Math.max(34,Math.min(58,Math.floor((w-(n-1)*7)/n)))+'px')};
  const cls=i=>{if(result==null)return'';const s=slots[i];if(!s||s.fixed)return'';return (s&&pool[s.t]===result[i])?'right':'wrong'};
  function render(){
    setSize();
    const slotHTML=(s,i)=>s==null?`<span class="slot" aria-label="empty space"></span>`:s.fixed?`<span class="slot fixed">${esc(s.fixed)}</span>`:`<button class="slot filled ${cls(i)}" data-s="${i}" ${locked?'disabled':''} aria-label="${esc(pool[s.t])}, tap to remove">${esc(pool[s.t])}</button>`;
    host.innerHTML=`<div class="slots">${isFree&&!slots.length?'<span class="free-placeholder">Tap the letters to spell the word</span>':slots.map(slotHTML).join('')}</div>
    <div class="pool" style="max-width:${Math.ceil(pool.length/Math.ceil(pool.length/7))*(parseInt(host.style.getPropertyValue('--tile-size'))+7)}px;margin-inline:auto">${pool.map((ch,i)=>`<button class="tile" data-t="${i}" ${used[i]||locked?'disabled':''} aria-label="letter ${esc(ch)}">${used[i]?'':esc(ch)}</button>`).join('')}</div>
    ${isFree&&!locked?`<div class="free-tools"><button class="ghost small" data-undo ${slots.length?'':'disabled'}>Undo last letter</button></div>`:''}`;
  }
  host.addEventListener('click',e=>{
    if(locked)return;
    const t=e.target.closest('[data-t]'),s=e.target.closest('[data-s]'),u=e.target.closest('[data-undo]');
    if(t){const i=+t.dataset.t;if(used[i])return;if(isFree){slots.push({t:i})}else{const k=slots.findIndex(x=>x===null);if(k<0)return;slots[k]={t:i}}used[i]=true;sfx.tap()}
    else if(s){const k=+s.dataset.s;const v=slots[k];if(!v||v.fixed)return;used[v.t]=false;if(isFree)slots.splice(k,1);else slots[k]=null}
    else if(u){const v=slots.pop();if(v)used[v.t]=false}
    else return;

  });
  render();
  return {
    value:()=>slots.map(s=>s?(s.fixed||pool[s.t]):'').join(''),
    full:()=>isFree?slots.length>0:slots.every(s=>s!==null),
    toSlots(L){if(!isFree)return;const keep=slots.slice(0,L);slots.slice(L).forEach(v=>used[v.t]=false);isFree=false;slots=Array.from({length:L},(_,i)=>keep[i]||null);render();updateCheck()},
    lock(correct){locked=true;result=correct;if(isFree){/* compare by position */}render()}
  };
}
function renderQuestion(){
  clearTimers(); const q=cur(); q.hinted=false; q.checked=false; const w=q.word, L=w.length;
  if(q.type==='unjumble'){
    shell('Unjumble the spelling','Tap the letters in the right order.');
    let pool=shuffle(w.split(''));for(let g=0;g<6&&L>1&&pool.join('')===w;g++)pool=shuffle(pool);
    $('#lbody').innerHTML='<div id="board"></div>';
    q.board=Board($('#board'),{pool,length:L}); say(w);
  } else if(q.type==='missing'){
    shell('Fill in the missing letters','Listen, then tap the letters that fit.');
    const nBlank=L<=3?1:L<=6?2:3; const idxs=shuffle([...Array(L).keys()]); const blanks=new Set();
    for(const i of idxs){if(blanks.size>=nBlank)break;if(!blanks.has(i-1)&&!blanks.has(i+1)||L<=3)blanks.add(i)}
    const fixed=w.split('').map((c,i)=>blanks.has(i)?null:c); const miss=[...blanks].map(i=>w[i]);
    const pool=shuffle(miss.concat(distractors(miss.join(''),miss,3)));
    $('#lbody').innerHTML='<div id="board"></div>';
    q.board=Board($('#board'),{pool,length:L,fixed}); say(w);
  } else if(q.type==='lcwc'){
    q.phase='look';
    shell('Look, cover, write, check',q.retry?'Let’s have another look at this one.':'Look carefully at the word and say it.');
    $('#lbody').innerHTML=`<div class="lookcard"><div class="steps"><span class="on">Look</span><span>Cover</span><span>Write</span><span>Check</span></div><div class="bigword">${chunkHTML(w)}</div></div>`;
    setMain('Cover it',true); say(w);
    return;
  } else {
    shell('Listen and spell','Spell the whole word you hear.');
    const pool=shuffle(w.split('').concat(distractors(w,w.split(''),L>8?2:3)));
    $('#lbody').innerHTML='<div id="coach"></div><div id="board"></div>';
    q.board=Board($('#board'),{pool,free:true});
    setTimeout(()=>say(w),250); startCoach(q);
  }
  updateCheck();
}
function coverLcwc(q){
  q.phase='write'; const w=q.word, L=w.length;
  $('.prompt h2').textContent='Look, cover, write, check';
  $('.prompt p').textContent='The word is covered. Now build it from memory.';
  const pool=shuffle(w.split('').concat(distractors(w,w.split(''),2)));
  $('#lbody').innerHTML=`<div class="lookcard"><div class="steps"><span>Look</span><span class="on">Cover</span><span class="on">Write</span><span>Check</span></div><div class="covered" aria-label="word covered">${'<i></i>'.repeat(L)}</div></div><div id="board"></div>`;
  q.board=Board($('#board'),{pool,length:L}); updateCheck();
}
function coach(html){const c=$('#coach');if(!c)return;c.innerHTML=`<div class="coach">${owl('think')}<div class="bubble">${html}</div></div>`}
function startCoach(q){
  const w=q.word, cs=chunks(w), dots=`<span class="dots" data-say-target>${cs.map(()=>'<span class="chunk"></span>').join('')}</span>`;
  lesson.timers.push(setTimeout(()=>{coach(`Let’s listen slowly. Watch the ${cs.length} parts light up. ${dots}`);say(w,{slow:true})},20000));
  lesson.timers.push(setTimeout(()=>{q.hinted=true;coach(`Here’s a clue: it starts with <b>“${esc(w[0])}”</b>. ${dots}`);say(w,{slow:true})},35000));
  lesson.timers.push(setTimeout(()=>{q.hinted=true;const tr=tricky(w);q.board.toSlots(w.length);coach(`It has <b>${w.length} letters</b> and starts with <b>“${esc(w[0])}”</b>.${tr?` Watch out for <b>“${esc(tr.c)}”</b> ${tr.where}.`:''}`)},50000));
}
const PRAISE=['Brilliant!','Super spelling!','You got it!','Fantastic!','Well done!','Amazing!'];
function check(){
  const q=cur(); if(!q) return;
  if(q.type==='lcwc'&&q.phase==='look'){coverLcwc(q);return}
  if(q.checked){next();return}
  if(!q.board||!q.board.full())return;
  q.checked=true;
  clearTimers();
  const ans=q.board.value(), ok=ans===q.word; q.board.lock(q.word);
  try{if(q.type==='lcwc'){const st=$('.steps');if(st)st.innerHTML='<span>Look</span><span>Cover</span><span>Write</span><span class="on">Check</span>';const cov=$('.covered');if(cov)cov.outerHTML=`<div class="bigword" style="font-size:2.4rem">${chunkHTML(q.word)}</div>`}}catch(e){}
  const stat=wordStat(q.word); stat.attempts++;
  lesson.results.push({word:q.word,type:q.type,ok,hinted:!!q.hinted,retry:!!q.retry});
  let gain=0;
  if(ok){
    stat.correct++; gain=q.hinted?5:(q.retry?6:10); lesson.xp+=gain; lesson.right++;
    if(q.type==='hear'&&!q.hinted&&!q.retry){const t=today();if(!stat.days.includes(t))stat.days.push(t);if(!stat.mastered&&stat.days.length>=3){stat.mastered=true;lesson.newMastered.push(q.word)}S.progress.cleanHear=(S.progress.cleanHear||0)+1}
    sfx.good();
  } else {
    lesson.wrong++; lesson.hearts=Math.max(0,lesson.hearts-1); sfx.bad();
    if(!lesson.requeued.has(q.word)){lesson.requeued.add(q.word);lesson.qs.splice(Math.min(lesson.qs.length,lesson.idx+3),0,{word:q.word,type:'lcwc',retry:true})}
  }
  try{
    $('.hearts').innerHTML=ICON.heart+lesson.hearts;
    $('.bar i').style.width=Math.round(100*(lesson.idx+1)/lesson.qs.length)+'%';
    const ow=$('.prompt .owl'); if(ow) ow.outerHTML=owl(ok?'cheer':'sleepy');
  }catch(e){}
  $('#listenrow').hidden=true;
  $('#feedback').innerHTML=ok
    ?`<div class="fb good" role="status"><h3>${ICON.tick}${pick(PRAISE)} <span style="margin-left:auto;font-size:1rem;color:var(--gold)">+${gain} XP</span></h3>${chunkHTML(q.word,'sm')}</div>`
    :`<div class="fb bad" role="status"><h3>${ICON.x}Nearly! Here is the spelling</h3><div class="row" style="justify-content:space-between">${chunkHTML(q.word,'sm')}<span class="row" style="gap:6px"><button class="ghost small" data-l="hear" aria-label="Hear it">${ICON.speaker}</button><button class="ghost small" data-l="slow" aria-label="Hear it slowly">${ICON.slow}</button></span></div><p class="note" style="margin:0">You spelled <b style="font-family:Andika,sans-serif">${esc(ans)}</b>. We will practise this word again soon.</p></div>`;
  const mb=$('#mainbtn'); const last=lesson.idx>=lesson.qs.length-1||(!ok&&lesson.hearts<=0); mb.textContent=last?(lesson.hearts<=0?'See how I did':'Finish and see my score'):'Continue'; mb.disabled=false; mb.className='btn block '+(ok?'good':'bad');
  if(!ok) setTimeout(()=>say(q.word,{slow:true}),350);
  try{mb.focus({preventScroll:true});mb.scrollIntoView({block:'nearest'})}catch(e){}
}
function next(){
  lesson.idx++;
  if(lesson.hearts<=0) return endLesson('hearts');
  if(lesson.idx>=lesson.qs.length) return endLesson('done');
  renderQuestion(); window.scrollTo(0,0);
}
function summarise(){
  const by={};
  (lesson.results||[]).forEach(r=>{const w=by[r.word]||(by[r.word]={word:r.word,tries:0,wrong:0,hinted:false,firstOk:null});w.tries++;if(!r.ok)w.wrong++;if(r.hinted)w.hinted=true;if(w.firstOk===null)w.firstOk=r.ok&&!r.hinted});
  const rows=Object.values(by).map(w=>Object.assign(w,{status:w.firstOk?'first':w.wrong?'missed':'hint'}));
  const order={missed:0,hint:1,first:2}; rows.sort((x,y)=>order[x.status]-order[y.status]||x.word.localeCompare(y.word));
  const total=rows.length, first=rows.filter(r=>r.status==='first').length;
  const pct=total?Math.round(100*first/total):0;
  return {rows,total,first,pct};
}
function starsFor(pct,completed){if(!completed)return 0;return pct>=90?3:pct>=70?2:1}
function starHTML(n,size){return `<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" class="${i<n?'on':''}" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>`).join('')}</span>`}
const fmtTime=ms=>{const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function endLesson(reason){
  try{window.scrollTo(0,0)}catch(e){}
  clearTimers(); try{if('speechSynthesis' in window) speechSynthesis.cancel()}catch(e){}
  lesson.active=false;
  const completed=reason==='done';
  const sum=summarise(); const stars=starsFor(sum.pct,completed); const secs=Math.round((Date.now()-(lesson.started||Date.now()))/1000);
  const bonus=completed?(lesson.wrong===0?15:5):0;
  let newB=[];
  try{
    const P=S.progress; P.xp=(P.xp||0)+lesson.xp+bonus;
    if(!Array.isArray(P.days)) P.days=[];
    if(completed){P.lessons=(P.lessons||0)+1; const t=today(); if(!P.days.includes(t)) P.days.push(t); if(P.days.length>400) P.days=P.days.slice(-400)}
    if(!Array.isArray(P.history)) P.history=[];
    if(sum.total){const entry={at:Date.now(),list:String(lesson.listTitle||'').slice(0,80),practice:!!lesson.practice,reason,score:sum.first,total:sum.total,stars,xp:lesson.xp+bonus,secs,missed:sum.rows.filter(r=>r.status==='missed').map(r=>r.word)};P.history.push(entry);saveHistory(entry)}
    if(P.history.length>60) P.history=P.history.slice(-60);
    newB=awardBadges({perfect:completed&&lesson.wrong===0});
    persistProgress();
  }catch(err){ toast('Your score could not be saved: '+(err&&err.message||err)); }
  try{renderChrome()}catch(e){}
  lesson.lastSummary=sum;
  const name=esc(profileName()||'superstar');
  const title=!completed?(reason==='hearts'?'Out of hearts':'Lesson stopped'):stars===3?(lesson.wrong===0?'Perfect spelling!':'Superstar speller!'):stars===2?'Great spelling!':'Good effort!';
  const msg=!completed?(reason==='hearts'?`Kit the owl says it is time for a rest. Here is how you did so far.`:'Here is how you did so far. Your XP has been saved.'):stars===3?`Brilliant work, ${name}!`:stars===2?`Well done, ${name}. Just a few to practise.`:`Keep going, ${name}. Practising the tricky words will help.`;
  const label={first:'Right first time',hint:'Right with a clue',missed:'Keep practising'};
  const missed=sum.rows.filter(r=>r.status!=='first').map(r=>r.word);
  const rows=sum.rows.map(r=>`<div class="scorerow ${r.status}"><span class="mark" aria-hidden="true">${r.status==='first'?ICON.tick:r.status==='hint'?'?':ICON.x}</span><span class="w">${esc(r.word)}</span><span class="lab">${label[r.status]}</span><button class="ghost small" data-say="${esc(r.word)}" aria-label="Hear ${esc(r.word)}">${ICON.speaker}</button></div>`).join('');
  $('#lesson-inner').innerHTML=`<div class="lbody" style="justify-content:flex-start"><div class="endcard">
    ${owl(completed&&stars>=2?'cheer':completed?'':'sleepy')}
    ${completed?starHTML(stars,52):''}
    <h2>${title}</h2>
    ${sum.total?`<div class="bigscore"><b>${sum.first}</b><span>out of ${sum.total}</span></div><p class="muted" style="margin:0">words spelled right first time${lesson.practice?' in this practice':''}</p>`:`<p class="muted" style="margin:0">No words were answered.</p>`}
    <p style="margin:0;max-width:36ch;font-weight:600">${msg}</p>
    <div class="endstats"><div class="stat"><b>${lesson.xp+bonus}</b><span>XP earned</span></div><div class="stat"><b>${fmtTime(secs*1000)}</b><span>Time</span></div><div class="stat"><b>${streak()}</b><span>Day streak</span></div></div>
    ${sum.total?`<section class="card scorecard" style="width:100%;text-align:left"><div class="eyebrow" style="margin-bottom:6px">Word by word</div>${rows}</section>`:''}
    ${lesson.newMastered.length?`<div class="card" style="width:100%"><div class="eyebrow">Newly mastered</div><div class="words" style="justify-content:center;margin-top:8px">${lesson.newMastered.map(w=>`<span class="chip mastered">${esc(w)}</span>`).join('')}</div></div>`:''}
    ${newB.length?`<div class="card" style="width:100%"><div class="eyebrow">New badges</div><div class="newbadges" style="margin-top:8px">${newB.map(b=>`<div style="text-align:center">${medal(b.g,b.c)}<div style="font-weight:700;font-size:.85rem">${b.name}</div></div>`).join('')}</div></div>`:''}
  </div></div>
  <div class="laction">${missed.length?`<button class="btn block pink" data-l="practise">Practise the ${missed.length===1?'tricky word':missed.length+' tricky words'}</button>`:''}${reason==='hearts'?'<button class="ghost" style="justify-content:center" data-l="again">Try the whole list again</button>':!missed.length?'<button class="btn block pink" data-l="again">Play again</button>':''}<button class="btn block" data-l="close">Back to the nest</button></div>`;
  lesson.missedWords=missed;
  if(completed){try{sfx.win();if(stars>=2)confetti()}catch(e){}}
}
$('#lesson').addEventListener('click',e=>{
  const sb=e.target.closest('[data-say]'); if(sb){say(sb.dataset.say);return}
  const b=e.target.closest('[data-l]'); if(!b) return; const q=cur();
  switch(b.dataset.l){
    case 'hear': if(q) say(q.word); break;
    case 'slow': if(q) say(q.word,{slow:true}); break;
    case 'main': check(); break;
    case 'next': next(); break;
    case 'quit':
      if(!$('#feedback')) break;
      $('#mainbtn').hidden=true; $('#listenrow').hidden=true;
      lesson.savedFb=$('#feedback').innerHTML;
      $('#feedback').innerHTML=`<div class="fb plain"><h3>Stop this lesson?</h3><p class="note" style="margin:0">XP earned so far will be saved, but the lesson will not count towards the streak.</p><button class="btn block pink" data-l="keep">Keep going</button><button class="ghost" style="justify-content:center" data-l="stop">Stop lesson</button></div>`; break;
    case 'keep': {$('#feedback').innerHTML=lesson.savedFb||'';$('#mainbtn').hidden=false;const q2=cur();$('#listenrow').hidden=!!(q2&&q2.checked);break}
    case 'stop': endLesson('stopped'); break;
    case 'again': closeLesson(); startLesson(); break;
    case 'practise': {const m=(lesson.missedWords||[]).slice(); closeLesson(); startLesson(m); break}
    case 'close': closeLesson(); break;
  }
});
function closeLesson(){$('#lesson').hidden=true;$('.app').hidden=false;lesson.active=false;renderChrome();renderView()}

document.addEventListener('keydown',e=>{
  if(!lesson.active||e.key!=='Enter')return;
  const a=document.activeElement; if(a&&a!==document.body&&/BUTTON|INPUT|TEXTAREA/.test(a.tagName))return;
  const mb=$('#mainbtn'); if(mb&&!mb.disabled&&!mb.hidden){e.preventDefault();mb.click()}
});
/* ---------- confetti ---------- */
function confetti(){
  if(reduceMotion) return; const c=$('#confetti'); c.hidden=false; const ctx=c.getContext('2d');
  const W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const cols=['#F7B1BF','#022140','#F2B650','#1D855A','#E98FA4','#3B6EA8'];
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  const t0=performance.now();
  (function frame(t){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()});if(t-t0<2600)requestAnimationFrame(frame);else{ctx.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

window.addEventListener('error',ev=>{try{toast('Something went wrong: '+(ev.message||'unknown error'))}catch(e){}});
window.addEventListener('unhandledrejection',ev=>{try{const r=ev.reason;toast('Something went wrong: '+((r&&(r.code||r.message))||'unknown error'))}catch(e){}});
/* ---------- boot ---------- */
renderChrome(); renderView(); connect();
})();
